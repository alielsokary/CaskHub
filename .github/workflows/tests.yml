name: Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          xcodebuild -project CaskHub.xcodeproj -scheme CaskHub \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
