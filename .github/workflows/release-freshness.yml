name: Release freshness

# Release gate: PRs into master must ship bundled CaskFlow data at least as
# new as the latest data release. Fix is one command:
#   ./Scripts/sync_bundled_categories.sh && git commit -am "Sync bundled categories"
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  bundled-categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare bundled categories.json with CaskFlow's latest release
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/latest.json \
            "https://github.com/alielsokary/CaskFlow/releases/latest/download/categories.json"
          curl -fsSL -o /tmp/latest-added-dates.json \
            "https://github.com/alielsokary/CaskFlow/releases/latest/download/added_dates.json"
          python3 - << 'EOF'
          import json, sys

          checks = [
              ("categories.json", "CaskHub/Resources/categories.json", "/tmp/latest.json"),
              ("added_dates.json", "CaskHub/Resources/added_dates.json", "/tmp/latest-added-dates.json"),
          ]
          stale = []
          for name, bundled_path, latest_path in checks:
              bundled = json.load(open(bundled_path))
              latest = json.load(open(latest_path))
              b, l = bundled["generatedDate"], latest["generatedDate"]
              print(f"{name}: bundled {b}, latest {l}")
              if b < l:
                  stale.append(name)
          if stale:
              print("\n::error::Bundled CaskFlow data is stale: " + ", ".join(stale))
              print("Run Scripts/sync_bundled_categories.sh and commit before releasing.")
              sys.exit(1)
          print("bundled data is current ✓")
          EOF
