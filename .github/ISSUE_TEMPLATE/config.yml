blank_issues_enabled: false
contact_links:
  - name: 🔒 Security vulnerability
    url: https://github.com/alielsokary/CaskHub/security/advisories/new
    about: Report privately — never through public issues. See SECURITY.md.
  - name: 🗂️ Wrong category, icon, or metadata for a cask
    url: https://github.com/alielsokary/CaskFlow/issues
    about: Cask categories, icons, and dates are generated by the CaskFlow pipeline.
  - name: 🍺 Missing or broken cask
    url: https://github.com/Homebrew/homebrew-cask/issues
    about: CaskHub displays Homebrew's catalog — cask availability issues belong upstream.
